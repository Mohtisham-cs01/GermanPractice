<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>German Reading Practice – Pollinations AI (✓ CORRECT API)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    /* ---------- ALL YOUR ORIGINAL STYLES (KEPT EXACTLY) ---------- */
    body {
        font-family: system-ui, sans-serif;
        background: #f3f4f6;
        margin: 0;
        padding: 20px;
        transition: background-color 0.3s, color 0.3s;
    }
    body.dark-mode {
        background: #111827;
        color: #f9fafb;
    }
    .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 30px 25px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        transition: background-color 0.3s, box-shadow 0.3s;
    }
    .dark-mode .container {
        background: #1f2937;
        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }
    h1 {
        text-align: center;
        margin-top: 0;
        margin-bottom: 25px;
        color: #1f2937;
    }
    .dark-mode h1 {
        color: #f9fafb;
    }

    .select-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 15px;
    }
    .key-row {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }
    .button-row {
        display: flex;
        gap: 10px;
    }
    .key-row input {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        background: white;
        transition: background-color 0.3s, border-color 0.3s;
    }
    .dark-mode .key-row input {
        background: #374151;
        border-color: #4b5563;
        color: #f9fafb;
    }
    select, button {
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        background: white;
        transition: background-color 0.3s, border-color 0.3s;
    }
    .dark-mode select,
    .dark-mode button:not(.tts-control) {
        background: #374151;
        border-color: #4b5563;
        color: #f9fafb;
    }
    button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 500;
    }
    button:hover {
        background: #1d4ed8;
    }
    .dark-mode button:hover:not(.tts-control) {
        background: #1e40af;
    }

    .output { margin-top: 20px; }
    .german-text {
        font-size: 18px;
        line-height: 1.8;
        margin-bottom: 20px;
        padding: 20px;
        background: #f9fafb;
        border-radius: 10px;
        transition: background-color 0.3s;
    }
    .dark-mode .german-text { background: #374151; }
    .word {
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 4px;
        transition: background 0.2s;
        border-bottom: 2px dotted #93c5fd;
    }
    .word:hover { background: #dbeafe; }
    .dark-mode .word:hover { background: #1e40af; }
    .translation-box {
        background: #dcfce7;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        border-left: 4px solid #16a34a;
        transition: background-color 0.3s;
    }
    .dark-mode .translation-box { background: #064e3b; }
    .vocab-box {
        background: #f0f9ff;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        border-left: 4px solid #0ea5e9;
        transition: background-color 0.3s;
    }
    .dark-mode .vocab-box { background: #0c4a6e; }
    .vocab-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
        margin-top: 10px;
    }
    .vocab-item {
        padding: 8px;
        background: white;
        border-radius: 5px;
        border: 1px solid #d1d5db;
        transition: background-color 0.3s, border-color 0.3s;
    }
    .dark-mode .vocab-item {
        background: #4b5563;
        border-color: #6b7280;
        color: #f9fafb;
    }
    .loading {
        text-align: center;
        padding: 30px;
        color: #6b7280;
    }
    .dark-mode .loading { color: #d1d5db; }
    .error {
        background: #fee2e2;
        color: #dc2626;
        padding: 15px;
        border-radius: 8px;
        margin: 15px 0;
        transition: background-color 0.3s;
    }
    .dark-mode .error { background: #7f1d1d; }
    .popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #111827;
        color: white;
        padding: 20px;
        border-radius: 12px;
        max-width: 300px;
        z-index: 1000;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        display: none;
    }
    .dark-mode .popup { background: #030712; }
    .popup h3 { margin-top: 0; color: #60a5fa; }
    .popup button { margin-top: 8px; width: 100%; }
    .popup button.secondary { background: #6b7280; }
    .popup button.secondary:hover { background: #4b5563; }
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 999;
        display: none;
    }
    .dark-mode-toggle {
        position: absolute;
        top: 20px;
        right: 20px;
        background: transparent;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #6b7280;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.3s;
    }
    .dark-mode-toggle:hover { background: rgba(0,0,0,0.1); }
    .dark-mode .dark-mode-toggle:hover { background: rgba(255,255,255,0.1); }
    .dark-mode .dark-mode-toggle { color: #d1d5db; }

    .tts-player {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        padding: 8px 15px;
        border-radius: 30px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        display: none;
        align-items: center;
        gap: 8px;
        z-index: 1000;
        transition: background-color 0.3s, box-shadow 0.3s;
        min-width: 300px;
        max-width: 500px;
    }
    .dark-mode .tts-player {
        background: #374151;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .tts-control {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.3s;
        padding: 0;
        flex-shrink: 0;
    }
    .tts-control:hover { background: #1d4ed8; }
    .tts-control:disabled { background: #9ca3af; cursor: not-allowed; }
    .tts-stop {
        background: #dc2626;
        width: 32px;
        height: 32px;
        font-size: 12px;
    }
    .tts-stop:hover { background: #b91c1c; }
    .tts-progress-container {
        flex: 1;
        height: 4px;
        background: #e5e7eb;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
    }
    .dark-mode .tts-progress-container { background: #4b5563; }
    .tts-progress-bar {
        height: 100%;
        background: #2563eb;
        width: 0%;
        transition: width 0.3s;
    }
    .tts-speed {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: #6b7280;
        flex-shrink: 0;
    }
    .dark-mode .tts-speed { color: #d1d5db; }
    .tts-speed select {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        border: 1px solid #d1d5db;
        background: white;
        min-width: 60px;
    }
    .dark-mode .tts-speed select {
        background: #4b5563;
        border-color: #6b7280;
        color: #f9fafb;
    }
    .tts-time {
        font-size: 11px;
        color: #6b7280;
        white-space: nowrap;
        flex-shrink: 0;
        min-width: 60px;
        text-align: center;
    }
    .dark-mode .tts-time { color: #d1d5db; }
    .tts-status {
        position: absolute;
        top: -25px;
        left: 50%;
        transform: translateX(-50%);
        background: #dc2626;
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 10px;
        display: none;
        white-space: nowrap;
    }
    .tts-status.error { background: #dc2626; }
    .tts-status.info { background: #2563eb; }
    .storage-indicator {
        position: absolute;
        top: 20px;
        left: 20px;
        background: #10b981;
        color: white;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        display: none;
        align-items: center;
        gap: 5px;
        animation: fadeInOut 2s ease-in-out;
    }
    @keyframes fadeInOut {
        0% { opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { opacity: 0; }
    }
    .topic-indicator {
        display: inline-block;
        background: #7c3aed;
        color: white;
        padding: 4px 10px;
        border-radius: 15px;
        font-size: 12px;
        margin-left: 10px;
        font-weight: normal;
        vertical-align: middle;
    }
    .dark-mode .topic-indicator { background: #8b5cf6; }

    #toggleApiKey {
        font-size: 18px;
        padding: 5px;
        border-radius: 4px;
        transition: background-color 0.3s;
    }

    #toggleApiKey:hover {
        background-color: #e5e7eb;
    }

    .dark-mode #toggleApiKey:hover {
        background-color: #4b5563;
    }
    
    /* Highlighted Generate Button */
    #generateBtn {
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        font-weight: bold;
        transition: all 0.3s ease;
    }
    
    #generateBtn:hover {
        background: linear-gradient(135deg, #1d4ed8, #2563eb);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        transform: translateY(-2px);
    }
    
    .dark-mode #generateBtn {
        background: linear-gradient(135deg, #3b82f6, #60a5fa);
        box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }
    
    .dark-mode #generateBtn:hover {
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
    }
    @media (max-width: 768px) {
        .select-row { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
        .key-row { flex-direction: column; }
        .button-row { flex-direction: column; }
        .tts-player {
            min-width: 280px;
            max-width: 90%;
            padding: 6px 12px;
            gap: 6px;
        }
        .tts-control { width: 32px; height: 32px; font-size: 12px; }
        .tts-stop { width: 28px; height: 28px; }
        .tts-speed { font-size: 11px; }
        .tts-speed select { font-size: 11px; min-width: 50px; padding: 3px 6px; }
        .tts-time { font-size: 10px; min-width: 50px; }
    }
</style>
</head>
<body>

<div class="dark-mode-toggle" onclick="toggleDarkMode()" title="Toggle dark mode">
    <span id="darkModeIcon">🌙</span>
</div>
<div class="storage-indicator" id="storageIndicator">
    <span>💾</span> <span>Saved to local storage</span>
</div>

<div class="container">
    <h1>🇩🇪 German Reading Practice – Pollinations AI (Updated Api version))</h1>

    <!-- ====== CONTROLS ====== -->
    <div class="select-row">
        <select id="level" onchange="saveFormInputs()">
            <option>A1</option> <option>A2</option> <option>B1</option> <option>B1.5</option>
            <option>B2</option> <option>C1</option> <option>C2</option>
        </select>

        <select id="length" onchange="saveFormInputs()">
            <option value="short">Short</option>
            <option value="medium">Medium</option>
            <option value="long">Long</option>
        </select>

        <select id="topic" onchange="saveFormInputs()">
            <option value="daily_life">Daily Life</option>
            <option value="food_cooking">Food & Cooking</option>
            <option value="travel">Travel & Tourism</option>
            <option value="work_business">Work & Business</option>
            <option value="hobbies">Hobbies & Free Time</option>
            <option value="weather">Weather & Seasons</option>
            <option value="family_friends">Family & Friends</option>
            <option value="health_fitness">Health & Fitness</option>
            <option value="shopping">Shopping</option>
            <option value="technology">Technology</option>
            <option value="education">Education & Learning</option>
            <option value="culture">German Culture</option>
            <option value="sports">Sports</option>
            <option value="random" selected>Random Topic</option>
        </select>

        <!-- ✅ CORRECT MODEL NAMES – directly from the official documentation -->
        <select id="model" onchange="saveFormInputs()">
            <option value="nova-fast" selected>Amazon Nova Micro (fast)</option>
            <option value="deepseek">DeepSeek V3.2</option>
            <option value="glm">Z.ai GLM-4.7</option>
            <option value="kimi">Moonshot Kimi K2.5</option>
            <option value="mistral">Mistral Small 3.2 24B</option>
            <option value="qwen-character">Qwen Character (alpha)</option>
            <option value="chickytutor">ChickyTutor</option>
        </select>
    </div>

    <!-- Publishable Key input -->
    <div class="key-row">
        <div style="position: relative; flex: 1;">
            <input type="password" id="apiKey" placeholder="Enter your Pollinations Publishable Key (required)" value="" onchange="saveFormInputs()">
            <span id="toggleApiKey" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; user-select: none;">👁️</span>
        </div>
        <button id="saveKeyBtn" style="background: #8b5cf6;" onclick="saveApiKey()">Save Key</button>
    </div>

    <div class="button-row">
        <button id="generateBtn" onclick="generate()" style="flex: 2;">Generate German Text</button>
        <button onclick="loadLastSaved()" style="flex: 1; background: #10b981;">Load Last Saved</button>
    </div>

    <div id="output" class="output">
        <div class="loading" id="loading">🔑 Enter your Pollinations publishable key and click "Generate".</div>
    </div>
</div>

<!-- Slim Floating TTS Player (unchanged) -->
<div class="tts-player" id="ttsPlayer">
    <div class="tts-status" id="ttsStatus"></div>
    <button class="tts-control" id="ttsPlayBtn" onclick="toggleTTS()" title="Play/Pause">▶️</button>
    <button class="tts-control tts-stop" id="ttsStopBtn" onclick="stopTTS()" disabled title="Stop">⏹️</button>
    <div class="tts-progress-container"><div class="tts-progress-bar" id="ttsProgress"></div></div>
    <div class="tts-time" id="ttsTime">00:00</div>
    <div class="tts-speed">
        <span>Speed:</span>
        <select id="ttsSpeed" onchange="changeTTSSpeed()">
            <option value="0.7">0.7x</option> <option value="0.8">0.8x</option>
            <option value="0.9" selected>0.9x</option> <option value="1">1x</option>
            <option value="1.1">1.1x</option> <option value="1.2">1.2x</option>
        </select>
    </div>
</div>

<div id="overlay" class="overlay" onclick="closePopup()"></div>
<div id="popup" class="popup">
    <h3 id="popupWord"></h3>
    <div id="popupMeaning"></div>
    <button onclick="speakWord()">🔊 Pronounce</button>
    <button onclick="closePopup()" class="secondary">Close</button>
</div>

<script>
    // -------------------------------------------------------------
    //   GLOBAL STATE & CONFIG (unchanged from your original)
    // -------------------------------------------------------------
    let vocab = {};
    let paragraphText = "";
    let currentWord = "";
    let englishTranslation = "";
    let ttsPlaying = false;
    let ttsUtterance = null;
    let sentences = [];
    let currentSentenceIndex = 0;
    let ttsRate = 0.9;
    let ttsSupported = false;
    let voicesLoaded = false;
    let germanVoice = null;
    let timerInterval = null;
    let startTime = 0;
    let elapsedTime = 0;
    let currentTopic = "";

    // Topics library (unchanged)
    const topics = {
        "daily_life": "Daily Life", "food_cooking": "Food & Cooking", "travel": "Travel & Tourism",
        "work_business": "Work & Business", "hobbies": "Hobbies & Free Time", "weather": "Weather & Seasons",
        "family_friends": "Family & Friends", "health_fitness": "Health & Fitness", "shopping": "Shopping",
        "technology": "Technology", "education": "Education & Learning", "culture": "German Culture",
        "sports": "Sports", "random": "Random Topic"
    };
    const topicDescriptions = {
        "daily_life": "daily routines, morning activities, evening activities, typical day",
        "food_cooking": "German food, cooking recipes, meals, restaurants, traditional dishes",
        "travel": "traveling in Germany, tourism, visiting cities, transportation",
        "work_business": "office life, business meetings, professions, career",
        "hobbies": "free time activities, sports, music, reading, collecting",
        "weather": "seasons, climate, weather conditions, seasonal activities",
        "family_friends": "family relationships, friends, social gatherings, celebrations",
        "health_fitness": "exercise, healthy lifestyle, doctor visits, wellness",
        "shopping": "shopping experiences, markets, stores, online shopping",
        "technology": "computers, smartphones, internet, social media, gadgets",
        "education": "school, university, learning methods, exams, studying",
        "culture": "German traditions, holidays, customs, arts, music",
        "sports": "football, winter sports, fitness activities, watching sports"
    };

    // -------------------------------------------------------------
    //   DARK MODE (unchanged)
    // -------------------------------------------------------------
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const icon = document.getElementById('darkModeIcon');
        if (document.body.classList.contains('dark-mode')) {
            icon.textContent = '☀️';
            localStorage.setItem('darkMode', 'enabled');
        } else {
            icon.textContent = '🌙';
            localStorage.setItem('darkMode', 'disabled');
        }
    }
    if (localStorage.getItem('darkMode') === 'enabled') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkModeIcon').textContent = '☀️';
    }

    // -------------------------------------------------------------
    //   FORM INPUTS MANAGEMENT
    // -------------------------------------------------------------
    function saveFormInputs() {
        const formData = {
            level: document.getElementById('level').value,
            length: document.getElementById('length').value,
            topic: document.getElementById('topic').value,
            model: document.getElementById('model').value,
            apiKey: document.getElementById('apiKey').value
        };
        
        localStorage.setItem('germanReadingPractice_formInputs', JSON.stringify(formData));
    }

    function loadFormInputs() {
        try {
            const savedData = localStorage.getItem('germanReadingPractice_formInputs');
            if (savedData) {
                const formData = JSON.parse(savedData);
                
                if (formData.level) document.getElementById('level').value = formData.level;
                if (formData.length) document.getElementById('length').value = formData.length;
                if (formData.topic) document.getElementById('topic').value = formData.topic;
                if (formData.model) document.getElementById('model').value = formData.model;
                if (formData.apiKey) document.getElementById('apiKey').value = formData.apiKey;
            }
        } catch (error) {
            console.error('Error loading form inputs:', error);
        }
    }

    // -------------------------------------------------------------
    //   API KEY MANAGEMENT
    // -------------------------------------------------------------
    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) {
            localStorage.setItem('pollinations_publishable_key', key);
            showStorageIndicator('API key saved');
            saveFormInputs(); // Also save to form inputs
        } else {
            localStorage.removeItem('pollinations_publishable_key');
            showStorageIndicator('API key removed');
            saveFormInputs(); // Also save to form inputs
        }
    }

    function loadApiKey() {
        const savedKey = localStorage.getItem('pollinations_publishable_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }

        // Initialize the toggle functionality after loading the key
        setupApiKeyToggle();
    }

    function showStorageIndicator(message) {
        const ind = document.getElementById('storageIndicator');
        ind.innerHTML = `<span>💾</span><span>${message}</span>`;
        ind.style.display = 'flex';
        setTimeout(() => { ind.style.display = 'none'; }, 2000);
    }

    // -------------------------------------------------------------
    //   API KEY VISIBILITY TOGGLE
    // -------------------------------------------------------------
    function setupApiKeyToggle() {
        const toggleButton = document.getElementById('toggleApiKey');
        const apiKeyInput = document.getElementById('apiKey');

        if (toggleButton && apiKeyInput) {
            let isPasswordVisible = false;

            toggleButton.addEventListener('click', function() {
                isPasswordVisible = !isPasswordVisible;

                if (isPasswordVisible) {
                    apiKeyInput.type = 'text';
                    toggleButton.textContent = '🔒'; // Closed eye icon
                } else {
                    apiKeyInput.type = 'password';
                    toggleButton.textContent = '👁️'; // Open eye icon
                }
            });
        }
    }

    // -------------------------------------------------------------
    //   TTS SETUP (unchanged)
    // -------------------------------------------------------------
    function checkTTSsupport() {
        if (!('speechSynthesis' in window)) {
            showTTSstatus('Speech synthesis not supported in your browser', 'error');
            return false;
        }
        ttsSupported = true;
        const voices = speechSynthesis.getVoices();
        if (voices.length > 0) { findGermanVoice(voices); voicesLoaded = true; }
        else {
            speechSynthesis.addEventListener('voiceschanged', () => {
                findGermanVoice(speechSynthesis.getVoices());
                voicesLoaded = true;
            });
        }
        return true;
    }
    function findGermanVoice(voices) {
        germanVoice = voices.find(voice => voice.lang.startsWith('de') || voice.name.toLowerCase().includes('german'));
        if (!germanVoice && voices.length > 0) germanVoice = voices[0];
    }
    function showTTSstatus(message, type) {
        const statusEl = document.getElementById('ttsStatus');
        statusEl.textContent = message;
        statusEl.className = `tts-status ${type}`;
        statusEl.style.display = 'block';
        setTimeout(() => statusEl.style.display = 'none', 3000);
    }

    // -------------------------------------------------------------
    //   SAVE / LOAD last generated (unchanged)
    // -------------------------------------------------------------
    function saveToLocalStorage(data) {
        try {
            const saveData = {
                ...data,
                timestamp: new Date().toISOString(),
                level: document.getElementById('level').value,
                length: document.getElementById('length').value,
                topic: currentTopic,
                model: document.getElementById('model').value
            };
            localStorage.setItem('germanReadingPractice_lastGenerated', JSON.stringify(saveData));
            showStorageIndicator('Saved to local storage');
        } catch (error) { console.error('Error saving to localStorage:', error); }
    }

    function loadLastSaved() {
        try {
            const savedData = localStorage.getItem('germanReadingPractice_lastGenerated');
            if (!savedData) { showTTSstatus('No saved data found', 'error'); return; }
            const data = JSON.parse(savedData);
            document.getElementById('level').value = data.level || 'A1';
            document.getElementById('length').value = data.length || 'short';
            document.getElementById('topic').value = data.topic || 'daily_life';
            document.getElementById('model').value = data.model || 'Amazon Nova Micro';
            paragraphText = data.paragraph || "";
            vocab = data.vocabulary || {};
            englishTranslation = data.english_translation || "";
            currentTopic = data.topic || "";
            if (!paragraphText) throw new Error("No paragraph in saved data");
            sentences = paragraphText.split(/(?<=[.!?])\s+/).filter(s => s.trim());
            renderAll();
            document.getElementById('ttsPlayer').style.display = 'flex';
            stopTTS();
            showTTSstatus('Loaded from local storage', 'info');
        } catch (error) {
            console.error('Error loading from localStorage:', error);
            showTTSstatus('Error loading saved data', 'error');
        }
    }

    // -------------------------------------------------------------
    //   TOPIC helpers (unchanged)
    // -------------------------------------------------------------
    function getRandomTopic() {
        const topicKeys = Object.keys(topics).filter(key => key !== 'random');
        return topicKeys[Math.floor(Math.random() * topicKeys.length)];
    }
    function getTopicForPrompt(selectedTopic) {
        if (selectedTopic === 'random') {
            currentTopic = getRandomTopic();
            return topicDescriptions[currentTopic] || topics[currentTopic];
        } else {
            currentTopic = selectedTopic;
            return topicDescriptions[selectedTopic] || topics[selectedTopic];
        }
    }
    function getTopicDisplayName(topicKey) { return topics[topicKey] || topicKey; }

    // -------------------------------------------------------------
    //   🚀 FIXED GENERATION – CORRECT MODEL NAMES + ENDPOINT
    // -------------------------------------------------------------
    async function generate() {
        // 1. Check TTS support
        if (!checkTTSsupport()) showTTSstatus('Speech synthesis not available', 'error');

        // 2. Get publishable key (mandatory)
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            document.getElementById("output").innerHTML = `
                <div class="error">
                    <p><strong>❌ Pollinations Publishable Key missing.</strong></p>
                    <p>Please enter your key in the field above. Get one from <a href="https://pollinations.ai" target="_blank">pollinations.ai</a>.</p>
                </div>`;
            return;
        }

        // 3. Collect parameters
        const level = document.getElementById("level").value;
        const length = document.getElementById("length").value;
        const topic = document.getElementById("topic").value;
        // ✅ Get the EXACT model name as shown in the dropdown (from official list)
        const model = document.getElementById("model").value;

        const topicForPrompt = getTopicForPrompt(topic);
        const topicDisplayName = getTopicDisplayName(currentTopic);
        const uid = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);

        // 4. Build the prompt (same as before – asks for strict JSON)
        const prompt = `Return ONLY valid JSON.
        German level: ${level}
        Length: ${length}
        Topic: ${topicForPrompt}

        Generate a German paragraph about ${topicForPrompt}.
        Create a vocabulary dictionary with ALL important words.
        Also provide the English translation.

        Format:
        {
        "paragraph": "German paragraph text",
        "vocabulary": {
            "word1": "English meaning",
            "compound_word": "English meaning"
        },
        "english_translation": "Full English translation here"
        }

        Rules:
        - Vocabulary must include each and every word from the paragraph
        - For each word, provide the appropriate meaning(s) based on context
        - Translation should be accurate
        - No explanations outside JSON
        - Make the paragraph relevant to the topic: ${topicForPrompt}
        - Include ALL words with their appropriate meaning(s)

        UID: ${uid}`;

        // 5. Show loading
        document.getElementById("output").innerHTML = `<div class="loading">Generating German text about ${topicDisplayName} (model: ${model}) ...</div>`;

        try {
            // ✅ CORRECT ENDPOINT – v1/chat/completions (OpenAI-compatible)
            const url = 'https://gen.pollinations.ai/v1/chat/completions';

            const requestBody = {
                model: model,                     // ✅ Uses exact official model name (e.g. "Amazon Nova Micro")
                messages: [
                    {
                        role: "user",
                        content: prompt
                    }
                ],
                response_format: { type: "json_object" },
                temperature: 0.7
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`   // ✅ Bearer token with your publishable key
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                let errorText = await response.text();
                throw new Error(`API error ${response.status}: ${errorText.substring(0,200)}`);
            }

            const json = await response.json();

            // 6. Extract the assistant's reply
            if (!json.choices || !json.choices[0] || !json.choices[0].message) {
                throw new Error("Unexpected API response structure");
            }
            const assistantMessage = json.choices[0].message.content;

            // 7. Parse the JSON from the reply
            // let parsedData;
            // try {
            //     parsedData = JSON.parse(assistantMessage);
            // } catch (e) {
            //     // Try to extract JSON from markdown or extra text
            //     const jsonMatch = assistantMessage.match(/\{[\s\S]*\}/);
            //     if (jsonMatch) {
            //         parsedData = JSON.parse(jsonMatch[0]);
            //     } else {
            //         throw new Error("No valid JSON found in the response");
            //     }
            // }
            text = assistantMessage.trim();
            const jsonStart = text.indexOf('{');
            const jsonEnd = text.lastIndexOf('}') + 1;
            
            if (jsonStart !== -1 && jsonEnd !== -1) {
                text = text.substring(jsonStart, jsonEnd);
            }
            const parsedData = JSON.parse(text);

            paragraphText = parsedData.paragraph || "";
            vocab = parsedData.vocabulary || {};
            englishTranslation = parsedData.english_translation || "";

            if (!paragraphText) {
                throw new Error("Response missing 'paragraph' field");
            }

            // 8. Split sentences for TTS
            sentences = paragraphText.split(/(?<=[.!?])\s+/).filter(s => s.trim());

            // 9. Save to localStorage
            const saveData = { ...parsedData, topic: currentTopic, topicDisplay: topicDisplayName };
            saveToLocalStorage(saveData);

            // 10. Render everything
            renderAll(topicDisplayName);

            // 11. Show TTS player
            document.getElementById('ttsPlayer').style.display = 'flex';
            stopTTS();

        } catch (e) {
            console.error("Generation error:", e);
            document.getElementById("output").innerHTML = `
                <div class="error">
                    <p><strong>❌ Error:</strong> Could not generate content.</p>
                    <p>${e.message}</p>
                    <p>Check your API key, model name, or try again.</p>
                    <p style="margin-top:10px; font-size:0.9em;">✅ <strong>Models now use exact names:</strong> Amazon Nova Micro, DeepSeek V3.2, Z.ai GLM-4.7, Moonshot Kimi K2.5, etc.</p>
                </div>
            `;
        }
    }

    // -------------------------------------------------------------
    //   RENDER (unchanged – exactly as in your original)
    // -------------------------------------------------------------
    function renderAll(topicName = "") {
        const output = document.getElementById("output");
        output.innerHTML = "";

        if (topicName && topicName !== "Random Topic") {
            const topicHeader = document.createElement("div");
            topicHeader.style.textAlign = "center";
            topicHeader.style.marginBottom = "15px";
            topicHeader.innerHTML = `
                <h2 style="margin: 0; display: inline-block;">
                    Topic: ${topicName}
                    <span class="topic-indicator">${topicName}</span>
                </h2>
            `;
            output.appendChild(topicHeader);
        }

        // German paragraph with clickable words
        const germanDiv = document.createElement("div");
        germanDiv.className = "german-text";
        germanDiv.id = "germanParagraph";

        const vocabKeys = Object.keys(vocab).sort((a, b) => b.length - a.length);
        let index = 0;
        while (index < paragraphText.length) {
            if (!/\w/.test(paragraphText[index])) {
                germanDiv.appendChild(document.createTextNode(paragraphText[index]));
                index++;
                continue;
            }
            let matched = null, matchedKey = null;
            for (const key of vocabKeys) {
                if (paragraphText.substring(index, index + key.length).toLowerCase() === key.toLowerCase()) {
                    matched = paragraphText.substring(index, index + key.length);
                    matchedKey = key;
                    break;
                }
            }
            if (matched) {
                const span = document.createElement("span");
                span.className = "word";
                span.textContent = matched;
                span.dataset.word = matched;
                span.dataset.vocabKey = matchedKey;
                span.onclick = () => showWordPopup(matched, matchedKey);
                germanDiv.appendChild(span);
                index += matched.length;
            } else {
                const wordMatch = paragraphText.substring(index).match(/^[\wäöüßÄÖÜ]+/);
                if (wordMatch) {
                    const word = wordMatch[0];
                    const span = document.createElement("span");
                    span.className = "word";
                    span.textContent = word;
                    span.dataset.word = word;
                    span.onclick = () => showWordPopup(word, word.toLowerCase());
                    germanDiv.appendChild(span);
                    index += word.length;
                } else {
                    germanDiv.appendChild(document.createTextNode(paragraphText[index]));
                    index++;
                }
            }
        }
        output.appendChild(germanDiv);

        // English translation
        if (englishTranslation) {
            const translationDiv = document.createElement("div");
            translationDiv.className = "translation-box";
            translationDiv.innerHTML = `<h3 style="margin-top:0; color:#166534;">📖 English Translation</h3><p>${englishTranslation}</p>`;
            output.appendChild(translationDiv);
        }

        // Vocabulary grid
        if (Object.keys(vocab).length > 0) {
            const vocabDiv = document.createElement("div");
            vocabDiv.className = "vocab-box";
            vocabDiv.innerHTML = `<h3 style="margin-top:0; color:#0c4a6e;">📚 Vocabulary List</h3>`;
            const vocabGrid = document.createElement("div");
            vocabGrid.className = "vocab-grid";
            Object.entries(vocab).forEach(([german, english]) => {
                const item = document.createElement("div");
                item.className = "vocab-item";
                item.innerHTML = `<strong>${german}</strong><br><small style="color:#4b5563;">${english}</small>`;
                vocabGrid.appendChild(item);
            });
            vocabDiv.appendChild(vocabGrid);
            output.appendChild(vocabDiv);
        }
    }

    // -------------------------------------------------------------
    //   TTS & POPUP (unchanged – keep your original functions)
    // -------------------------------------------------------------
    function toggleTTS() {
        if (!ttsSupported) { showTTSstatus('Speech synthesis not supported', 'error'); return; }
        if (!voicesLoaded) { showTTSstatus('Loading voices...', 'info'); setTimeout(() => { if (voicesLoaded) toggleTTS(); else showTTSstatus('Failed to load voices', 'error'); }, 1000); return; }
        if (ttsPlaying) pauseTTS(); else playTTS();
    }
    function playTTS() {
        if (!sentences.length) { showTTSstatus('No text to read', 'error'); return; }
        ttsPlaying = true;
        document.getElementById('ttsPlayBtn').textContent = '⏸️';
        document.getElementById('ttsStopBtn').disabled = false;
        if (currentSentenceIndex >= sentences.length) currentSentenceIndex = 0;
        startTime = Date.now() - elapsedTime;
        startTimer();
        speakCurrentSentence();
    }
    function pauseTTS() {
        ttsPlaying = false; document.getElementById('ttsPlayBtn').textContent = '▶️';
        if (speechSynthesis.speaking) speechSynthesis.pause();
        if (timerInterval) clearInterval(timerInterval); timerInterval = null; elapsedTime = Date.now() - startTime;
    }
    function stopTTS() {
        ttsPlaying = false; currentSentenceIndex = 0;
        document.getElementById('ttsPlayBtn').textContent = '▶️';
        document.getElementById('ttsStopBtn').disabled = true;
        document.getElementById('ttsProgress').style.width = '0%';
        document.getElementById('ttsTime').textContent = '00:00';
        if (speechSynthesis.speaking) speechSynthesis.cancel();
        if (timerInterval) clearInterval(timerInterval); timerInterval = null;
        elapsedTime = 0; startTime = 0;
    }
    function speakCurrentSentence() {
        if (!ttsPlaying || currentSentenceIndex >= sentences.length) {
            ttsPlaying = false; document.getElementById('ttsPlayBtn').textContent = '▶️';
            document.getElementById('ttsStopBtn').disabled = true;
            document.getElementById('ttsProgress').style.width = '100%';
            if (timerInterval) clearInterval(timerInterval); timerInterval = null;
            return;
        }
        const sentence = sentences[currentSentenceIndex].trim();
        const progress = ((currentSentenceIndex + 1) / sentences.length) * 100;
        document.getElementById('ttsProgress').style.width = `${progress}%`;
        ttsUtterance = new SpeechSynthesisUtterance(sentence);
        ttsUtterance.lang = 'de-DE'; ttsUtterance.rate = ttsRate;
        if (germanVoice) ttsUtterance.voice = germanVoice;
        ttsUtterance.onstart = () => showTTSstatus(`Reading sentence ${currentSentenceIndex+1}/${sentences.length}`, 'info');
        ttsUtterance.onend = () => { currentSentenceIndex++; if (ttsPlaying) setTimeout(() => speakCurrentSentence(), 300); };
        ttsUtterance.onerror = (event) => { console.error('TTS Error:', event); showTTSstatus('Error reading text', 'error'); currentSentenceIndex++; if (ttsPlaying) setTimeout(() => speakCurrentSentence(), 500); };
        try { speechSynthesis.speak(ttsUtterance); } catch (error) { console.error(error); showTTSstatus('Failed to speak', 'error'); ttsPlaying = false; }
    }
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (startTime > 0) {
                const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsedSeconds / 60).toString().padStart(2,'0');
                const seconds = (elapsedSeconds % 60).toString().padStart(2,'0');
                document.getElementById('ttsTime').textContent = `${minutes}:${seconds}`;
            }
        }, 1000);
    }
    function changeTTSSpeed() {
        ttsRate = parseFloat(document.getElementById('ttsSpeed').value);
        if (ttsUtterance && speechSynthesis.speaking) {
            speechSynthesis.cancel();
            setTimeout(() => speakCurrentSentence(), 100);
        }
    }
    function showWordPopup(word, vocabKey) {
        currentWord = word;
        let meaning = vocab[vocabKey] || vocab[word] || vocab[word.toLowerCase()] || "No translation available";
        document.getElementById("popupWord").textContent = `🇩🇪 ${word}`;
        document.getElementById("popupMeaning").innerHTML = `<div style="margin:10px 0; padding:10px; background:#1f2937; border-radius:6px;"><strong style="color:#93c5fd;">English:</strong><br>${meaning}</div>`;
        document.getElementById("overlay").style.display = "block";
        document.getElementById("popup").style.display = "block";
    }
    function closePopup() {
        document.getElementById("overlay").style.display = "none";
        document.getElementById("popup").style.display = "none";
    }
    function speakWord() {
        if (!currentWord) return;
        if (!ttsSupported) { showTTSstatus('Speech synthesis not available', 'error'); return; }
        const u = new SpeechSynthesisUtterance(currentWord);
        u.lang = "de-DE"; u.rate = ttsRate;
        if (germanVoice) u.voice = germanVoice;
        u.onerror = (event) => { console.error('Word pronunciation error:', event); showTTSstatus('Cannot pronounce word', 'error'); };
        try { speechSynthesis.speak(u); } catch (error) { console.error('Speech synthesis error:', error); showTTSstatus('Failed to speak', 'error'); }
    }

    // -------------------------------------------------------------
    //   PAGE INIT
    // -------------------------------------------------------------
    window.addEventListener('load', () => {
        checkTTSsupport();
        loadFormInputs();  // load saved form inputs first
        loadApiKey();  // load saved publishable key
        if (!localStorage.getItem('pollinations_publishable_key')) {
            document.getElementById("output").innerHTML = `<div class="loading">🔑 Please enter your Pollinations Publishable Key above and click "Generate".</div>`;
        }
        if (localStorage.getItem('germanReadingPractice_lastGenerated')) {
            console.log('Saved data available. Use "Load Last Saved".');
        }
    });
</script>
